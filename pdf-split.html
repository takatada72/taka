<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<title>PDF分割ツール</title>

<script src="pdf-lib.min.js"></script>
<script src="pdf.min.js"></script>

<style>

body{
    font-family: Arial;
    background:#f5f5f5;
    padding:30px;
}

.container{
    background:white;
    padding:30px;
    border-radius:10px;
    max-width:1100px;
    margin:auto;
}

button{
    background:#0078d4;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#005ea2;
}

.page-list{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    margin-top:20px;
}

.page-item{
    border:1px solid #ccc;
    padding:10px;
    border-radius:8px;
    width:160px;
    background:white;
    text-align:center;
}

canvas{
    border:1px solid #ddd;
    margin-bottom:10px;
    width:140px;
}

</style>

</head>

<body>

<div class="container">

<h1>PDF分割ツール</h1>

<input
    type="file"
    id="pdfFile"
    accept=".pdf">

<br><br>

<div
    class="page-list"
    id="pageList">

</div>

<br>

<button id="splitBtn">

選択位置で分割

</button>

</div>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
    'pdf.worker.min.js';

let pdfBytes;
let pageCount;

document
.getElementById('pdfFile')
.addEventListener('change', async (e) => {

    try{

        const file =
            e.target.files[0];

        if(!file){

            return;
        }

const originalBytes =
    await file.arrayBuffer();

pdfBytes =
    new Uint8Array(originalBytes);


        const loadingTask =
            pdfjsLib.getDocument({
                data: pdfBytes
            });

        const pdf =
            await loadingTask.promise;

        pageCount =
            pdf.numPages;

        const pageList =
            document.getElementById('pageList');

        pageList.innerHTML = '';

        for(let i = 1; i <= pdf.numPages; i++){

            const page =
                await pdf.getPage(i);

            const viewport =
                page.getViewport({ scale:0.3 });

            const canvas =
                document.createElement('canvas');

            const context =
                canvas.getContext('2d');

            canvas.height =
                viewport.height;

            canvas.width =
                viewport.width;

            await page.render({
                canvasContext:context,
                viewport:viewport
            }).promise;

            const div =
                document.createElement('div');

            div.className = 'page-item';

            div.innerHTML = `
                <label>
                    <input
                        type="checkbox"
                        value="${i}">
                    Page ${i}
                </label>
            `;

            div.prepend(canvas);

            pageList.appendChild(div);

        }

    }catch(error){

        console.error(error);

        alert('PDF読み込みエラー');

    }

});

document
.getElementById('splitBtn')
.addEventListener('click', async () => {

    try{

        const checked =
            Array.from(
                document.querySelectorAll(
                    'input[type="checkbox"]:checked'
                )
            )
            .map(cb => parseInt(cb.value))
            .sort((a,b)=>a-b);

        if(checked.length === 0){

            alert('分割位置を選択してください');

            return;
        }

        const { PDFDocument } = PDFLib;

        const srcPdf =
            await PDFDocument.load(pdfBytes);

        const splitPoints =
            [1, ...checked, pageCount + 1];

        for(let i = 0; i < splitPoints.length - 1; i++){

            const start =
                splitPoints[i];

            const end =
                splitPoints[i + 1] - 1;

            if(start > end){

                continue;

            }

            const newPdf =
                await PDFDocument.create();

            const pageIndexes =
                [];

            for(
                let p = start - 1;
                p <= end - 1;
                p++
            ){

                pageIndexes.push(p);

            }

            if(pageIndexes.length === 0){

                continue;

            }

            const copiedPages =
                await newPdf.copyPages(
                    srcPdf,
                    pageIndexes
                );

            copiedPages.forEach(page => {

                newPdf.addPage(page);

            });

            const pdfBytesNew =
                await newPdf.save();

            const blob =
                new Blob(
                    [pdfBytesNew],
                    { type:'application/pdf' }
                );

            const link =
                document.createElement('a');

            link.href =
                URL.createObjectURL(blob);

            link.download =
                `split-${i + 1}.pdf`;

            link.click();

        }

        alert('PDF分割完了');

    }catch(error){

        console.error(error);

        alert('分割エラー');

    }

});

</script>

</body>
</html>
