<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<title>PDF TOOL PORTAL</title>

<style>

body{
    font-family: Arial;
    background:#f5f5f5;
    padding:40px;
}

.container{
    max-width:1000px;
    margin:auto;
}

h1{
    margin-bottom:30px;
}

.tool-grid{
    display:flex;
    gap:30px;
    flex-wrap:wrap;
}

.tool-card{
    background:white;
    width:280px;
    padding:25px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.tool-card h2{
    margin-top:0;
}

.tool-card p{
    color:#666;
}

.tool-card a{
    display:inline-block;
    margin-top:15px;
    background:#0078d4;
    color:white;
    text-decoration:none;
    padding:12px 18px;
    border-radius:6px;
}

.tool-card a:hover{
    background:#005ea2;
}

</style>

</head>

<body>

<div class="container">

<h1>PDF TOOL PORTAL</h1>

<div class="tool-grid">

<div class="tool-card">

<h2>PDF結合</h2>

<p>
複数のPDFファイルを
1つに結合します
</p>

<a href="merge.html">

PDF結合を開く

</a>

</div>

<div class="tool-card">

<h2>PDFページ削除</h2>

<p>
不要ページを選択して
削除します
</p>

<a href="pdf-remove-pages.html">

PDFページ削除を開く

</a>

</div>

</div>

</div>

</body>

</html>
