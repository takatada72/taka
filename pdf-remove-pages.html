<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<title>PDFページ削除ツール</title>

<script src="pdf-lib.min.js"></script>
<script src="pdf.min.js"></script>

<style>

body{
    font-family: Arial;
    background:#f5f5f5;
    padding:30px;
}

.container{
    background:white;
    padding:30px;
    border-radius:10px;
    max-width:1000px;
    margin:auto;
}

button{
    background:#0078d4;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#005ea2;
}

.page-list{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    margin-top:20px;
}

.page-item{
    border:1px solid #ccc;
    padding:10px;
    border-radius:8px;
    width:160px;
    background:white;
    text-align:center;
}

canvas{
    border:1px solid #ddd;
    margin-bottom:10px;
    width:140px;
}

</style>

</head>

<body>

<div class="container">

<h1>PDFページ削除ツール</h1>

<input
    type="file"
    id="pdfFile"
    accept=".pdf">

<br><br>

<div
    class="page-list"
    id="pageList">

</div>

<br>

<button id="removeBtn">

選択ページを削除

</button>

</div>

<script>

let pdfDocLib;
let pdfBytes;

document
.getElementById('pdfFile')
.addEventListener('change', async (e) => {

    try{

        const file =
            e.target.files[0];

        if(!file){

            return;
        }

        pdfBytes =
            await file.arrayBuffer();

        const { PDFDocument } = PDFLib;

        pdfDocLib =
            await PDFDocument.load(pdfBytes);

        const loadingTask =
            pdfjsLib.getDocument({
                data: pdfBytes
            });

        const pdf =
            await loadingTask.promise;

        const pageList =
            document.getElementById('pageList');

        pageList.innerHTML = '';

        for(let i = 1; i <= pdf.numPages; i++){

            const page =
                await pdf.getPage(i);

            const viewport =
                page.getViewport({ scale: 0.3 });

            const canvas =
                document.createElement('canvas');

            const context =
                canvas.getContext('2d');

            canvas.height =
                viewport.height;

            canvas.width =
                viewport.width;

            await page.render({
                canvasContext: context,
                viewport: viewport
            }).promise;

            const div =
                document.createElement('div');

            div.className = 'page-item';

            div.innerHTML = `
                <label>
                    <input
                        type="checkbox"
                        value="${i - 1}">
                    Page ${i}
                </label>
            `;

            div.prepend(canvas);

            pageList.appendChild(div);

        }

    }catch(error){

        console.error(error);

        alert('PDF読み込みエラー');

    }

});

document
.getElementById('removeBtn')
.addEventListener('click', async () => {

    try{

        if(!pdfDocLib){

            alert('PDFを選択してください');

            return;
        }

        const checked =
            document.querySelectorAll(
                'input[type="checkbox"]:checked'
            );

        const removePages =
            Array.from(checked)
            .map(cb => parseInt(cb.value))
            .sort((a,b) => b - a);

        removePages.forEach(pageIndex => {

            pdfDocLib.removePage(pageIndex);

        });

        const pdfBytesNew =
            await pdfDocLib.save();

        const blob =
            new Blob(
                [pdfBytesNew],
                { type:'application/pdf' }
            );

        const link =
            document.createElement('a');

        link.href =
            URL.createObjectURL(blob);

        link.download =
            'removed-pages.pdf';

        link.click();

        alert('ページ削除完了');

    }catch(error){

        console.error(error);

        alert('削除エラー');

    }

});

</script>

</body>
</html>
