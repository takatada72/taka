<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<title>PDFページ削除ツール</title>

<script src="pdf-lib.min.js"></script>

<style>

body{
    font-family: Arial;
    background:#f5f5f5;
    padding:30px;
}

.container{
    background:white;
    padding:30px;
    border-radius:10px;
    max-width:700px;
    margin:auto;
}

button{
    background:#0078d4;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#005ea2;
}

.page-list{
    margin-top:20px;
    margin-bottom:20px;
    border:1px solid #ccc;
    padding:15px;
    border-radius:8px;
    max-height:300px;
    overflow:auto;
}

.page-item{
    margin-bottom:10px;
}

</style>

</head>

<body>

<div class="container">

<h1>PDFページ削除ツール</h1>

<input
    type="file"
    id="pdfFile"
    accept=".pdf">

<br><br>

<button id="loadBtn">

ページ一覧を表示

</button>

<div
    class="page-list"
    id="pageList">

</div>

<button id="removeBtn">

選択ページを削除

</button>

</div>

<script>

let pdfDoc;

document
.getElementById('loadBtn')
.addEventListener('click', async () => {

    try{

        const { PDFDocument } = PDFLib;

        const fileInput =
            document.getElementById('pdfFile');

        const file =
            fileInput.files[0];

        if(!file){

            alert('PDFを選択してください');

            return;
        }

        const bytes =
            await file.arrayBuffer();

        pdfDoc =
            await PDFDocument.load(bytes);

        const pageCount =
            pdfDoc.getPageCount();

        const pageList =
            document.getElementById('pageList');

        pageList.innerHTML = '';

        for(let i = 0; i < pageCount; i++){

            const div =
                document.createElement('div');

            div.className = 'page-item';

            div.innerHTML = `
                <label>
                    <input
                        type="checkbox"
                        value="${i}">
                    Page ${i + 1}
                </label>
            `;

            pageList.appendChild(div);

        }

    }catch(error){

        console.error(error);

        alert('PDF読み込みエラー');

    }

});

document
.getElementById('removeBtn')
.addEventListener('click', async () => {

    try{

        if(!pdfDoc){

            alert('先にPDFを読み込んでください');

            return;
        }

        const checked =
            document.querySelectorAll(
                'input[type="checkbox"]:checked'
            );

        const removePages =
            Array.from(checked)
            .map(cb => parseInt(cb.value))
            .sort((a,b) => b - a);

        removePages.forEach(pageIndex => {

            pdfDoc.removePage(pageIndex);

        });

        const pdfBytes =
            await pdfDoc.save();

        const blob =
            new Blob(
                [pdfBytes],
                { type:'application/pdf' }
            );

        const link =
            document.createElement('a');

        link.href =
            URL.createObjectURL(blob);

        link.download =
            'removed-pages.pdf';

        link.click();

        alert('ページ削除完了');

    }catch(error){

        console.error(error);

        alert('削除エラー');

    }

});

</script>

</body>
</html>
