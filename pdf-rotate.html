<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<title>PDF回転ツール</title>

<script src="pdf-lib.min.js"></script>
<script src="pdf.min.js"></script>

<style>

body{
    font-family: Arial;
    background:#f5f5f5;
    padding:30px;
}

.container{
    background:white;
    padding:30px;
    border-radius:10px;
    max-width:1200px;
    margin:auto;
}

button{
    background:#0078d4;
    color:white;
    border:none;
    padding:10px 16px;
    border-radius:5px;
    cursor:pointer;
    font-size:14px;
    margin:4px;
}

button:hover{
    background:#005ea2;
}

.page-list{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    margin-top:20px;
}

.page-item{
    border:1px solid #ccc;
    padding:10px;
    border-radius:8px;
    width:200px;
    background:white;
    text-align:center;
}

.canvas-wrapper{
    width:160px;
    height:220px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

canvas{
    border:1px solid #ddd;
    width:160px;
    transition:transform 0.3s;
}

.rotate-info{
    margin-top:8px;
    color:#666;
    font-size:13px;
}

.download-btn{
    margin-top:30px;
    padding:14px 24px;
    font-size:16px;
}

</style>

</head>

<body>

<div class="container">

<h1>PDF回転ツール</h1>

<input
    type="file"
    id="pdfFile"
    accept=".pdf">

<div
    class="page-list"
    id="pageList">

</div>

<button
    class="download-btn"
    id="downloadBtn">

回転PDFをダウンロード

</button>

</div>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
    'pdf.worker.min.js';

let pdfBytes;
let pdfDocLib;
let pageRotations = {};

document
.getElementById('pdfFile')
.addEventListener('change', async (e) => {

    try{

        const file =
            e.target.files[0];

        if(!file){

            return;
        }

        pdfBytes =
            await file.arrayBuffer();

        const { PDFDocument } = PDFLib;

        pdfDocLib =
            await PDFDocument.load(pdfBytes);

        const loadingTask =
            pdfjsLib.getDocument({
                data: pdfBytes
            });

        const pdf =
            await loadingTask.promise;

        const pageList =
            document.getElementById('pageList');

        pageList.innerHTML = '';

        pageRotations = {};

        for(let i = 1; i <= pdf.numPages; i++){

            pageRotations[i] = 0;

            const page =
                await pdf.getPage(i);

            const viewport =
                page.getViewport({ scale:0.35 });

            const canvas =
                document.createElement('canvas');

            canvas.id =
                `canvas-${i}`;

            const context =
                canvas.getContext('2d');

            canvas.height =
                viewport.height;

            canvas.width =
                viewport.width;

            await page.render({
                canvasContext:context,
                viewport:viewport
            }).promise;

            const wrapper =
                document.createElement('div');

            wrapper.className =
                'canvas-wrapper';

            wrapper.appendChild(canvas);

            const div =
                document.createElement('div');

            div.className = 'page-item';

            div.innerHTML = `
                <div>
                    <button onclick="rotateLeft(${i})">
                        ← 左
                    </button>

                    <button onclick="rotateRight(${i})">
                        右 →
                    </button>
                </div>

                <div class="rotate-info"
                     id="rotate-info-${i}">
                    回転: 0°
                </div>

                <div>
                    Page ${i}
                </div>
            `;

            div.prepend(wrapper);

            pageList.appendChild(div);

        }

    }catch(error){

        console.error(error);

        alert('PDF読み込みエラー');

    }

});

function rotateLeft(pageNum){

    pageRotations[pageNum] -= 90;

    applyRotation(pageNum);

}

function rotateRight(pageNum){

    pageRotations[pageNum] += 90;

    applyRotation(pageNum);

}

function applyRotation(pageNum){

    const rotation =
        pageRotations[pageNum];

    document.getElementById(
        `rotate-info-${pageNum}`
    ).innerText =
        `回転: ${rotation}°`;

    const canvas =
        document.getElementById(
            `canvas-${pageNum}`
        );

    canvas.style.transform =
        `rotate(${rotation}deg)`;

}

document
.getElementById('downloadBtn')
.addEventListener('click', async () => {

    try{

        const { degrees } = PDFLib;

        const originalBytes =
            await pdfDocLib.save();

        const newPdf =
            await PDFLib.PDFDocument.load(
                originalBytes
            );

        const pages =
            newPdf.getPages();

        pages.forEach((page, index) => {

            const rotation =
                pageRotations[index + 1] || 0;

            page.setRotation(
                degrees(rotation)
            );

        });

        const pdfBytesNew =
            await newPdf.save();

        const blob =
            new Blob(
                [pdfBytesNew],
                { type:'application/pdf' }
            );

        const link =
            document.createElement('a');

        link.href =
            URL.createObjectURL(blob);

        link.download =
            'rotated.pdf';

        link.click();

        alert('回転PDF生成完了');

    }catch(error){

        console.error(error);

        alert('回転エラー');

    }

});

</script>

</body>
</html>
