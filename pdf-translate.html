<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<title>PDF簡易翻訳プレビュー</title>

<script src="pdf.min.js"></script>

<style>

body{
    font-family: Arial;
    background:#f5f5f5;
    padding:30px;
}

.container{
    background:white;
    padding:30px;
    border-radius:10px;
    max-width:1200px;
    margin:auto;
}

h1{
    margin-bottom:20px;
}

.translate-note{

    font-size:18px;
    color:#666;
    margin-left:10px;

}

button{
    background:#0078d4;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#005ea2;
}

.output{

    margin-top:30px;
    padding:20px;
    border:1px solid #ccc;
    border-radius:8px;
    background:#fafafa;

    max-height:700px;
    overflow:auto;
    line-height:1.8;

}

.page-title{

    margin-top:30px;
    font-size:22px;
    font-weight:bold;
    color:#0078d4;

}

.file-area{

    margin-top:20px;
    margin-bottom:20px;

}

</style>

</head>

<body>

<div class="container">

<h1>

PDF簡易翻訳プレビュー

<span class="translate-note">

（右クリック → 日本語に翻訳）

</span>

</h1>

<div class="file-area">

<input
    type="file"
    id="pdfFile"
    accept=".pdf">

</div>

<button id="extractBtn">

テキスト抽出

</button>

<div
    class="output"
    id="output">

</div>

</div>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
    'pdf.worker.min.js';

document
.getElementById('extractBtn')
.addEventListener('click', async () => {

    try{

        const file =
            document
            .getElementById('pdfFile')
            .files[0];

        if(!file){

            alert('PDFを選択してください');

            return;
        }

        const bytes =
            await file.arrayBuffer();

        const loadingTask =
            pdfjsLib.getDocument({
                data: bytes
            });

        const pdf =
            await loadingTask.promise;

        const output =
            document.getElementById('output');

        output.innerHTML = '';

        for(let i = 1; i <= pdf.numPages; i++){

            const page =
                await pdf.getPage(i);

            const textContent =
                await page.getTextContent();

            const strings =
                textContent.items.map(
                    item => item.str
                );

            const text =
                strings.join(' ');

            const title =
                document.createElement('div');

            title.className =
                'page-title';

            title.innerText =
                `Page ${i}`;

            const textDiv =
                document.createElement('div');

            textDiv.innerText =
                text;

            output.appendChild(title);

            output.appendChild(textDiv);

        }

        alert(
            '右クリック → 日本語に翻訳'
        );

    }catch(error){

        console.error(error);

        alert('翻訳プレビューエラー');

    }

});

</script>

</body>
</html>
