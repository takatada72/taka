<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<title>PDFページ並び替えツール</title>

<script src="pdf-lib.min.js"></script>
<script src="pdf.min.js"></script>
<script src="sortable.min.js"></script>

<style>

body{
    font-family: Arial;
    background:#f5f5f5;
    padding:30px;
}

.container{
    background:white;
    padding:30px;
    border-radius:10px;
    max-width:1200px;
    margin:auto;
}

button{
    background:#0078d4;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
    margin-top:20px;
}

button:hover{
    background:#005ea2;
}

.page-list{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    margin-top:20px;
}

.page-item{
    border:1px solid #ccc;
    padding:10px;
    border-radius:8px;
    width:180px;
    background:white;
    text-align:center;
    cursor:grab;
}

.page-item:active{
    cursor:grabbing;
}

canvas{
    border:1px solid #ddd;
    margin-bottom:10px;
    width:160px;
}

.drag-text{
    color:#666;
    margin-top:8px;
    font-size:13px;
}

</style>

</head>

<body>

<div class="container">

<h1>PDFページ並び替えツール</h1>

<input
    type="file"
    id="pdfFile"
    accept=".pdf">

<div
    class="page-list"
    id="pageList">

</div>

<button id="downloadBtn">

並び替えPDFをダウンロード

</button>

</div>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
    'pdf.worker.min.js';

let fileObject;
let pageCount;

document
.getElementById('pdfFile')
.addEventListener('change', async (e) => {

    try{

        fileObject =
            e.target.files[0];

        if(!fileObject){

            return;
        }

        const bytes =
            await fileObject.arrayBuffer();

        const loadingTask =
            pdfjsLib.getDocument({
                data: bytes
            });

        const pdf =
            await loadingTask.promise;

        pageCount =
            pdf.numPages;

        const pageList =
            document.getElementById('pageList');

        pageList.innerHTML = '';

        for(let i = 1; i <= pdf.numPages; i++){

            const page =
                await pdf.getPage(i);

            const viewport =
                page.getViewport({ scale:0.35 });

            const canvas =
                document.createElement('canvas');

            const context =
                canvas.getContext('2d');

            canvas.height =
                viewport.height;

            canvas.width =
                viewport.width;

            await page.render({
                canvasContext:context,
                viewport:viewport
            }).promise;

            const div =
                document.createElement('div');

            div.className =
                'page-item';

            div.dataset.page =
                i - 1;

            div.innerHTML = `
                <div class="drag-text">
                    ⇅ ドラッグで移動
                </div>

                <div>
                    Page ${i}
                </div>
            `;

            div.prepend(canvas);

            pageList.appendChild(div);

        }

        new Sortable(pageList, {

            animation:150

        });

    }catch(error){

        console.error(error);

        alert('PDF読み込みエラー');

    }

});

document
.getElementById('downloadBtn')
.addEventListener('click', async () => {

    try{

        if(!fileObject){

            alert('PDFを選択してください');

            return;
        }

        const originalBytes =
            await fileObject.arrayBuffer();

        const { PDFDocument } = PDFLib;

        const srcPdf =
            await PDFDocument.load(originalBytes);

        const newPdf =
            await PDFDocument.create();

        const pageItems =
            document.querySelectorAll('.page-item');

        const pageOrder =
            Array.from(pageItems)
            .map(item =>
                parseInt(item.dataset.page)
            );

        const copiedPages =
            await newPdf.copyPages(
                srcPdf,
                pageOrder
            );

        copiedPages.forEach(page => {

            newPdf.addPage(page);

        });

        const pdfBytesNew =
            await newPdf.save();

        const blob =
            new Blob(
                [pdfBytesNew],
                { type:'application/pdf' }
            );

        const link =
            document.createElement('a');

        link.href =
            URL.createObjectURL(blob);

        link.download =
            'reordered.pdf';

        link.click();

        alert('PDF並び替え完了');

    }catch(error){

        console.error(error);

        alert('並び替えエラー');

    }

});

</script>

</body>
</html>
