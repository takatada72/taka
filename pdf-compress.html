<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<title>PDF軽量化ツール</title>

<script src="pdf-lib.min.js"></script>
<script src="pdf.min.js"></script>

<style>

body{
    font-family: Arial;
    background:#f5f5f5;
    padding:30px;
}

.container{
    background:white;
    padding:30px;
    border-radius:10px;
    max-width:900px;
    margin:auto;
}

button{
    background:#0078d4;
    color:white;
    border:none;
    padding:14px 24px;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;
    margin-top:20px;
}

button:hover{
    background:#005ea2;
}

.info{
    margin-top:20px;
    color:#666;
    line-height:1.8;
}

.result{
    margin-top:20px;
    font-weight:bold;
    color:#008000;
}

</style>

</head>

<body>

<div class="container">

<h1>PDF軽量化ツール</h1>

<input
    type="file"
    id="pdfFile"
    accept=".pdf">

<br>

<button id="compressBtn">

PDFを軽量化

</button>

<div class="info">

※ スキャンPDFや画像PDFで効果があります

</div>

<div
    class="result"
    id="result">

</div>

</div>

<script>

document
.getElementById('compressBtn')
.addEventListener('click', async () => {

    try{

        const fileInput =
            document.getElementById('pdfFile');

        const file =
            fileInput.files[0];

        if(!file){

            alert('PDFを選択してください');

            return;
        }

        const originalSize =
            (file.size / 1024 / 1024)
            .toFixed(2);

        const bytes =
            await file.arrayBuffer();

        const { PDFDocument } = PDFLib;

        const pdfDoc =
            await PDFDocument.load(bytes);

        const compressedBytes =
            await pdfDoc.save({

                useObjectStreams:true,
                addDefaultPage:false,
                objectsPerTick:20

            });

        const compressedSize =
            (
                compressedBytes.length
                / 1024
                / 1024
            ).toFixed(2);

        const blob =
            new Blob(
                [compressedBytes],
                { type:'application/pdf' }
            );

        const link =
            document.createElement('a');

        link.href =
            URL.createObjectURL(blob);

        link.download =
            'compressed.pdf';

        link.click();

        document.getElementById('result')
        .innerHTML = `
            元サイズ:
            ${originalSize} MB
            <br>
            圧縮後:
            ${compressedSize} MB
        `;

        alert('PDF軽量化完了');

    }catch(error){

        console.error(error);

        alert('軽量化エラー');

    }

});

</script>

</body>
</html>
